name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2-dev libgirepository-2.0-dev pkg-config
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements.txt
      - name: Run Python tests
        run: python -m pytest -q

  native-gtk:
    name: Native GTK smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install GTK and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2-dev libgirepository-2.0-dev pkg-config gir1.2-gtk-3.0 xvfb xauth
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise native GTK with isolated offline state
        run: timeout 45s xvfb-run -a python scripts/gtk_smoke.py --screenshot-dir "$RUNNER_TEMP/toggl-gtk-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-gtk-smoke
          path: ${{ runner.temp }}/toggl-gtk-smoke
          if-no-files-found: ignore
          retention-days: 7

  web-interface:
    name: Web interface and native WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install WebKit and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2-dev libgirepository-2.0-dev pkg-config gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb xauth dbus-daemon
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix ui
      - run: npm test --prefix ui
      - run: npm run lint --prefix ui
      - run: npm run build --prefix ui
      - name: Check the shipped offline bundle
        run: git diff --exit-code -- toggl_web_assets
      - name: Exercise the real React window against private offline state
        run: GTK_USE_PORTAL=0 GIO_USE_PROXY_RESOLVER=dummy NO_AT_BRIDGE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 PYWEBVIEW_LOG=debug LIBGL_ALWAYS_SOFTWARE=1 timeout 120s dbus-run-session -- xvfb-run -a python scripts/webview_smoke.py --screenshot-dir "$RUNNER_TEMP/toggl-webview-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-webview-smoke
          path: ${{ runner.temp }}/toggl-webview-smoke
          if-no-files-found: ignore
          retention-days: 7

  vicinae:
    name: Vicinae extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vicinae/package-lock.json
      - name: Install Vicinae dependencies
        run: npm ci --prefix vicinae
      - name: Type-check
        run: npm run check --prefix vicinae
      - name: Test
        run: npm test --prefix vicinae
      - name: Build
        run: npm run build --prefix vicinae -- --out dist
