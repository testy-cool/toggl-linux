name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2-dev libgirepository-2.0-dev pkg-config
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements.txt
      - name: Run Python tests
        run: python -m pytest -q

  vicinae:
    name: Vicinae extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vicinae/package-lock.json
      - name: Install Vicinae dependencies
        run: npm ci --prefix vicinae
      - name: Type-check
        run: npm run check --prefix vicinae
      - name: Test
        run: npm test --prefix vicinae
      - name: Build
        run: npm run build --prefix vicinae -- --out dist
